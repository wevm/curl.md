packages:
  - cli

auditConfig:
  # undici WebSocket client CVEs in miniflare (dev-only, no production impact).
  # Cannot override undici>=7.24.0 — it breaks miniflare's fetch (POST + 401 → 500).
  # TODO: Remove once miniflare ships with undici >=7.24.0 as a direct dependency.
  # https://github.com/cloudflare/workers-sdk/issues/12912
  ignoreCves:
    - CVE-2026-1525
    - CVE-2026-1526
    - CVE-2026-1527
    - CVE-2026-1528
    - CVE-2026-2229
    - CVE-2026-2581
  ignoreGhsas:
    - GHSA-6cpc-mj5c-m9rq # false positive — matches npm "cli" package, not our "curl.md" workspace

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@cloudflare/vitest-pool-workers'
  - '@testcontainers/postgresql'
  - incur
  - testcontainers

onlyBuiltDependencies:
  - bun
  - msw
  - simple-git-hooks
  - workerd

trustPolicy: no-downgrade

trustPolicyExclude:
  - '@tailwindcss/vite@0.0.0-insiders.a4be983'
  - semver@6.3.1
  - tailwindcss@0.0.0-insiders.a4be983

catalog:
  hono: ^4.12.7
