packages:
  - pkg

catalog:
  zod: ^4.3.6

minimumReleaseAge: 1440

# TODO: remove @cloudflare/vitest-pool-workers, miniflare, wrangler exceptions once past 1440min release age
minimumReleaseAgeExclude:
  - "@cloudflare/vitest-pool-workers"
  - incur
  - miniflare
  - wrangler

onlyBuiltDependencies:
  - msw
  - simple-git-hooks

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
