allowBuilds:
  '@anthropic-ai/claude-code': true
  '@google/genai': false
  '@sentry/cli': true
  bun: true
  cpu-features: false
  esbuild: false
  koffi: false
  msgpackr-extract: false
  msw: true
  opencode-ai: true
  protobufjs: false
  sharp: false
  ssh2: false
  workerd: true
auditConfig:
  ignoreGhsas:
    # false positive — matches npm "cli" package, not our "curl.md" workspace
    - GHSA-6cpc-mj5c-m9rq
blockExoticSubdeps: true
catalog:
  hono: ^4.13.11
  # Vite+ dependency aliases.
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vite-plus: 0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - bun@1.4.4
  - '@oven/bun-darwin-aarch64@1.4.4'
  - '@oven/bun-darwin-x64@1.4.4'
  - '@oven/bun-freebsd-aarch64@1.4.4'
  - '@oven/bun-freebsd-x64@1.4.4'
  - '@oven/bun-linux-aarch64@1.4.4'
  - '@oven/bun-linux-aarch64-android@1.4.4'
  - '@oven/bun-linux-aarch64-musl@1.4.4'
  - '@oven/bun-linux-x64@1.4.4'
  - '@oven/bun-linux-x64-android@1.4.4'
  - '@oven/bun-linux-x64-musl@1.4.4'
  - '@oven/bun-windows-aarch64@1.4.4'
  - '@oven/bun-windows-x64@1.4.4'
  - incur
overrides:
  '@babel/core@<=7.29.0': 7.29.7
  '@grpc/grpc-js@>=1.14.0 <1.14.5': 1.14.5
  '@hono/node-server@>=1.19.10 <2.1.3': 2.1.3
  '@opentelemetry/core@<2.8.0': 2.8.0
  '@protobufjs/utf8@<=1.1.0': 1.1.1
  '@toon-format/toon@<2.3.1': 2.3.1
  basic-ftp@<=5.3.0: 5.3.1
  baseline-browser-mapping@>=2.0.0 <2.11.0: 2.11.0
  brace-expansion@>=2.0.0 <2.1.7: 2.1.7
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  browserslist@<4.28.7: 4.28.7
  esbuild@>=0.27.3 <0.28.1: 0.28.1
  fast-uri@<=3.1.1: 3.1.2
  fast-xml-builder@<=1.1.6: 1.1.7
  fast-xml-parser@<5.7.0: 5.7.0
  # Consumers use the retained glob/glob.sync APIs (not the removed callback API).
  glob@>=9.0.0 <14.0.2: 14.0.2
  ip-address@<10.1.1: 10.1.1
  js-yaml@>=3.0.0 <3.15.2: 3.15.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  # Consumers use named minimatch/Minimatch exports, including readdir-glob.
  minimatch@>=5.0.0 <11.0.1: 11.0.1
  nanoid@>=3.0.0 <3.3.18: 3.3.18
  nanoid@>=5.0.0 <5.1.16: 5.1.16
  postcss@<8.5.23: 8.5.23
  protobufjs@>=7.0.0 <7.6.5: 7.6.5
  semver@<7.7.4: 7.7.4
  seroval@<1.6.11: 1.6.11
  sharp@>=0.34.0 <0.35.5: 0.35.5
  smol-toml@<1.9.0: 1.9.0
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  tinypool@>=2.0.0 <2.1.2: 2.1.2
  tmp@<0.2.7: 0.2.7
  # effect and remark-mdx-frontmatter both use the retained named parse export.
  toml@>=3.0.0 <5.0.1: 5.0.1
  undici@>=7.0.0 <7.30.1: 7.30.1
  undici@>=8.0.0 <8.12.2: 8.12.2
  uuid@<14.0.0: 14.0.0
  vite: 'catalog:'
  vitest: 'catalog:'
  ws@>=8.0.0 <8.21.0: 8.21.0
  # Keep Zod 3 consumers on their own API; do not force them onto Zod 4.
  zod@>=4.0.0 <4.6.6: 4.6.6
packageExtensions:
  '@voidzero-dev/vite-plus-core@*':
    dependencies:
      vite-plus: 0.1.24
packages:
  - cli
  - plugins/*
# TODO: Remove once issue is fixed
# https://github.com/TanStack/router/pull/7115
patchedDependencies:
  '@tanstack/react-router@1.170.41': config/patches/@tanstack__react-router@1.170.41.patch
  '@tanstack/router-core@1.171.34': config/patches/@tanstack__router-core@1.171.34.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
strictDepBuilds: true
strictPeerDependencies: true
trustPolicy: no-downgrade
verifyDepsBeforeRun: false
