packages:
  - cli
  - plugins/*

auditConfig:
  ignoreCves:
    - CVE-2026-1525
    - CVE-2026-1526
    - CVE-2026-1527
    - CVE-2026-1528
    - CVE-2026-2229
    - CVE-2026-2581
  ignoreGhsas:
    - GHSA-6cpc-mj5c-m9rq

catalog:
  hono: ^4.12.14

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - hono
  - incur

onlyBuiltDependencies:
  - bun
  - msw
  - simple-git-hooks
  - workerd

overrides:
  # Force emulate's transitive @hono/node-server to the patched release for GHSA-92pp-h63x-v22m.
  '@hono/node-server': 1.19.13
  basic-ftp@<=5.2.2: 5.3.0
  brace-expansion@>=2.0.0 <2.0.3: 2.0.3
  defu@<=6.1.4: 6.1.5
  h3: 2.0.1-rc.18
  h3-v2: npm:h3@2.0.1-rc.18
  lodash@>=4.0.0 <4.18.0: 4.18.0
  miniflare>undici: 7.18.2
  path-to-regexp@>=8.0.0 <8.4.0: 8.4.0
  picomatch@>=4.0.0 <4.0.4: 4.0.4
  protobufjs@<7.5.5: 7.5.5

# Temporary until TanStack/router issue #7115 lands
# https://github.com/TanStack/router/pull/7115
patchedDependencies:
  '@tanstack/react-router@1.168.7': config/patches/@tanstack__react-router@1.168.7.patch
  '@tanstack/router-core@1.168.6': config/patches/@tanstack__router-core@1.168.6.patch

trustPolicy: no-downgrade

trustPolicyExclude:
  - effect@4.0.0-beta.48
  - react-redux@9.2.0
  - reselect@5.1.1
  - semver@6.3.1
