allowBuilds:
  '@anthropic-ai/claude-code': true
  '@google/genai': false
  '@sentry/cli': true
  bun: true
  cpu-features: false
  esbuild: false
  koffi: false
  msgpackr-extract: false
  msw: true
  opencode-ai: true
  protobufjs: false
  sharp: false
  ssh2: false
  workerd: true
auditConfig:
  ignoreGhsas:
    # false positive — matches npm "cli" package, not our "curl.md" workspace
    - GHSA-6cpc-mj5c-m9rq
blockExoticSubdeps: true
catalog:
  hono: ^4.12.25
  # Vite+ dependency aliases.
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vite-plus: 0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - incur
overrides:
  '@babel/core@<=7.29.0': 7.29.7
  '@grpc/grpc-js@>=1.14.0 <1.14.4': 1.14.4
  '@opentelemetry/core@<2.8.0': 2.8.0
  '@protobufjs/utf8@<=1.1.0': 1.1.1
  '@tanstack/start-server-core@<1.167.30': 1.167.30
  basic-ftp@<=5.3.0: 5.3.1
  brace-expansion@>=5.0.0 <5.0.6: 5.0.6
  esbuild@>=0.27.3 <0.28.1: 0.28.1
  fast-uri@<=3.1.1: 3.1.2
  fast-xml-builder@<=1.1.6: 1.1.7
  fast-xml-parser@<5.7.0: 5.7.0
  ip-address@<10.1.1: 10.1.1
  js-yaml@<3.15.0: 3.15.0
  js-yaml@>=4.0.0 <=4.1.1: 4.3.0
  protobufjs@<=7.6.2: 7.6.3
  semver@<7.7.4: 7.7.4
  tmp@<0.2.7: 0.2.7
  undici@>=7.0.0 <7.28.0: 7.28.0
  uuid@<14.0.0: 14.0.0
  vite: 'catalog:'
  vitest: 'catalog:'
  ws@>=8.0.0 <8.21.0: 8.21.0
packageExtensions:
  '@voidzero-dev/vite-plus-core@*':
    dependencies:
      vite-plus: 0.1.24
packages:
  - cli
  - plugins/*
# TODO: Remove once issue is fixed
# https://github.com/TanStack/router/pull/7115
patchedDependencies:
  '@tanstack/react-router@1.169.2': config/patches/@tanstack__react-router@1.169.2.patch
  '@tanstack/router-core@1.169.2': config/patches/@tanstack__router-core@1.169.2.patch
peerDependencyRules:
  allowAny:
    - vite
    - vitest
strictDepBuilds: true
strictPeerDependencies: true
trustPolicy: no-downgrade
verifyDepsBeforeRun: false
