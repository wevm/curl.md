name: Production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: false

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    secrets: inherit

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run migrations
        run: pnpm db:migrate latest
        env:
          DB_URL: ${{ secrets.DB_URL }}

      - name: Generate types
        run: |
          pnpm gen:types
          pnpm db:codegen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_URL: ${{ secrets.DB_URL }}

      - name: Build
        run: pnpm build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: production
          DB_URL: ${{ secrets.DB_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy to Production
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          wranglerVersion: ""
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          environment: production
          vars: |
            STRIPE_PUBLISHABLE_KEY
          secrets: |
            COOKIE_SECRET
            GH_CLIENT_ID
            GH_CLIENT_SECRET
            SENTRY_DSN
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            TOKEN_ENCRYPTION_KEY
        env:
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}

  changesets:
    name: Changesets
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build CLI
        run: pnpm build:cli

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          commit: "chore: version packages"
          title: "chore: version packages"
          version: pnpm changeset version
          publish: pnpm pkg:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TODO(public): uncomment when repo is public
          # NPM_CONFIG_PROVENANCE: true

  release_binaries:
    name: Release Binaries
    needs: changesets
    if: needs.changesets.outputs.published == 'true'
    uses: ./.github/workflows/release_binaries.yml
    with:
      tag: ${{ fromJson(needs.changesets.outputs.publishedPackages)[0].name }}@${{ fromJson(needs.changesets.outputs.publishedPackages)[0].version }}
