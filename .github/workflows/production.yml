name: Production

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.run_id }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: false

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    with:
      dispatch_pro_sha: ${{ github.sha }}
      submodules: true
    secrets: inherit

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.PRO_APP_ID }}
          private-key: ${{ secrets.PRO_APP_PRIVATE_KEY }}
          repositories: curl.md.pro

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/wevm/curl.md.pro".insteadOf "https://github.com/wevm/curl.md.pro"
          git submodule update --init
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run migrations
        run: pnpm db:migrate latest
        env:
          DB_URL: ${{ secrets.DB_URL }}

      - name: Generate types
        run: |
          pnpm gen:types
          pnpm db:codegen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_URL: ${{ secrets.DB_URL }}

      - name: Build
        run: pnpm build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: production
          DB_URL: ${{ secrets.DB_URL }}

      - name: Deploy to Production
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          wranglerVersion: ""
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          environment: production
          secrets: |
            COOKIE_SECRET
            GH_CLIENT_ID
            GH_CLIENT_SECRET
            TOKEN_ENCRYPTION_KEY
        env:
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}

  changesets:
    name: Changesets
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.PRO_APP_ID }}
          private-key: ${{ secrets.PRO_APP_PRIVATE_KEY }}
          repositories: curl.md.pro

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/wevm/curl.md.pro".insteadOf "https://github.com/wevm/curl.md.pro"
          git submodule update --init
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build CLI
        run: pnpm build:cli

      - name: Create release PR or publish
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          commit: "chore: version packages"
          title: "chore: version packages"
          version: pnpm changeset version
          publish: pnpm pkg:format && pnpm changeset publish && pnpm pkg:restore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TODO: uncomment when repo is public
          # NPM_CONFIG_PROVENANCE: true
