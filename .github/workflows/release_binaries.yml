name: Release Binaries

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: false
        type: string

permissions: {}

jobs:
  build:
    if: ${{ (inputs.tag || github.event.release.tag_name) != '' }}
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            os: macos-latest
            artifact: curl.md-darwin-arm64
          - target: bun-darwin-x64
            os: macos-latest
            artifact: curl.md-darwin-x64
          - target: bun-linux-x64
            os: ubuntu-latest
            artifact: curl.md-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-latest
            artifact: curl.md-linux-arm64
          - target: bun-windows-x64
            os: ubuntu-latest
            artifact: curl.md-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Build
        run: bun build cli/src/bin.ts --compile --target=${{ matrix.target }} --outfile=${{ matrix.artifact }}

      - name: Re-sign macOS binary
        if: startsWith(matrix.target, 'bun-darwin-')
        run: |
          # Bun's compiled macOS binaries can ship with an invalid embedded signature blob.
          # This worked with Bun 1.3.10, but Bun 1.3.12 produced darwin binaries that macOS
          # killed on exec locally (`Killed: 9`) with `codesign --verify` reporting an invalid
          # or unsupported signature. Re-sign ad hoc before upload.
          # Ref: https://github.com/oven-sh/bun/issues/29361
          # TODO: remove this re-sign step once Bun's macOS compile/signature issue is fixed.
          codesign --remove-signature "${{ matrix.artifact }}" || true
          codesign -s - "${{ matrix.artifact }}"

      - name: Verify macOS signature
        if: startsWith(matrix.target, 'bun-darwin-')
        run: codesign --verify --verbose=4 "${{ matrix.artifact }}"

      - name: Verify binary runs
        if: matrix.os != 'ubuntu-latest' || !endsWith(matrix.artifact, '.exe')
        run: ./"${{ matrix.artifact }}" --version

      - name: Generate checksum
        run: shasum -a 256 "${{ matrix.artifact }}" | cut -d' ' -f1 > "${{ matrix.artifact }}.sha256"

      - name: Upload to release
        run: gh release upload "$TAG" "${{ matrix.artifact }}" "${{ matrix.artifact }}.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}

  test:
    name: Test install.sh (${{ matrix.os }})
    needs: build
    if: ${{ (inputs.tag || github.event.release.tag_name) != '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Run install script
        run: sh public/install.sh "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Verify binary
        run: ~/.local/bin/curl.md --version

      - name: Verify aliases
        run: |
          ~/.local/bin/curlmd --version
          ~/.local/bin/md --version
