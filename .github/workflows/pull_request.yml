name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    with:
      dispatch_pro_sha: ${{ contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.pull_request.author_association) && github.event.pull_request.head.sha || '' }}
      submodules: ${{ contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.pull_request.author_association) }}
    secrets: inherit

  preview:
    name: Preview
    if: contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.CORE_APP_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          repositories: curl.md.pro

      - name: Dispatch preview deploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          printf '{"event_type":"preview-deploy","client_payload":{"sha":"%s","pr_number":"%s"}}' \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.event.pull_request.number }}" \
            | gh api repos/wevm/curl.md.pro/dispatches --method POST --input -

  publish-preview:
    name: Publish Preview # rename to curl.md cli or something
    if: contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build CLI
        run: pnpm build:cli

      - name: Publish preview
        run: |
          if git diff --quiet origin/${{ github.base_ref }}...HEAD -- cli/; then
            echo "No changes to publish"
          else
            pnpx pkg-pr-new publish ./cli
          fi
