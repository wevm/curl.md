name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

env:
  WRANGLER_SEND_METRICS: false

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    secrets: inherit

  preview:
    name: Preview
    needs: check
    if: ${{ github.repository == 'wevm/curl.md' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.pull_request.author_association) }}
    uses: ./.github/workflows/preview_deploy.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  cli:
    name: Publish
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build CLI
        run: pnpm build:cli

      - name: Publish preview
        run: |
          node --experimental-strip-types scripts/formatPackage.ts
          pnpx pkg-pr-new publish --pnpm ./cli ./plugins/pi
