name: Pull Request Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  dispatch-preview-cleanup:
    name: Dispatch Preview Cleanup
    if: contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.CORE_APP_ID }}
          private-key: ${{ secrets.CORE_APP_PRIVATE_KEY }}
          repositories: curl.md.pro

      - name: Dispatch cleanup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          printf '{"event_type":"preview-cleanup","client_payload":{"pr_number":"%s","sha":"%s"}}' \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | gh api repos/wevm/curl.md.pro/dispatches --method POST --input -
