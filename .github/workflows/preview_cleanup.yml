name: Preview Cleanup

on:
  pull_request:
    types: [closed, converted_to_draft]

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_NAME: curl-pr${{ github.event.pull_request.number }}
  PREVIEW_HYPERDRIVE_NAME: curl-hd-pr${{ github.event.pull_request.number }}
  PREVIEW_BRANCH_NAME: pr-${{ github.event.pull_request.number }}
  PREVIEW_KV_NAME: curl-kv-pr${{ github.event.pull_request.number }}

jobs:
  cleanup:
    name: Cleanup Preview
    if: contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Remove Worker from Queue consumers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          QUEUE_IDS=$(curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" \
            | jq -r --arg suffix "-pr${{ github.event.pull_request.number }}" \
              '.result[] | select(.queue_name | endswith($suffix)) | .queue_id')
          for QUEUE_ID in $QUEUE_IDS; do
            CONSUMER_ID=$(curl -sS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/consumers" \
              | jq -r --arg name "$PREVIEW_NAME" '.result[] | select(.script == $name) | .consumer_id // empty')
            if [ -n "$CONSUMER_ID" ]; then
              curl -sS -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID/consumers/$CONSUMER_ID" \
                || true
            fi
          done

      - name: Delete Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PREVIEW_NAME?force=true" \
            || true

      - name: Delete Hyperdrive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          HD_ID=$(curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs" \
            | jq -r --arg name "$PREVIEW_HYPERDRIVE_NAME" '(.result // [])[] | select(.name == $name) | .id // empty')
          if [ -n "$HD_ID" ]; then
            curl -sS -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs/$HD_ID" \
              || true
          fi

      - name: Delete PlanetScale branch
        env:
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_ORG: ${{ secrets.PLANETSCALE_ORG }}
          PLANETSCALE_DB: ${{ secrets.PLANETSCALE_DB }}
        run: |
          curl -sS -X DELETE \
            -H "Authorization: $PLANETSCALE_SERVICE_TOKEN_ID:$PLANETSCALE_SERVICE_TOKEN" \
            "https://api.planetscale.com/v1/organizations/$PLANETSCALE_ORG/databases/$PLANETSCALE_DB/branches/$PREVIEW_BRANCH_NAME" \
            || true

      - name: Delete KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_ID=$(curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            | jq -r --arg name "$PREVIEW_KV_NAME" '.result[] | select(.title == $name) | .id // empty')
          if [ -n "$KV_ID" ]; then
            curl -sS -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_ID" \
              || true
          fi

      - name: Delete Stripe webhook endpoint
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          APEX="pr${{ github.event.pull_request.number }}"
          ENDPOINT_ID=$(curl -sS https://api.stripe.com/v1/webhook_endpoints \
            -u "$STRIPE_SECRET_KEY:" \
            -G -d "limit=100" \
            | jq -r --arg apex "$APEX" '.data[] | select(.metadata.preview == $apex) | .id')
          if [ -n "$ENDPOINT_ID" ]; then
            curl -sS -X DELETE "https://api.stripe.com/v1/webhook_endpoints/$ENDPOINT_ID" \
              -u "$STRIPE_SECRET_KEY:" || true
          fi

      - name: Delete Queues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          QUEUE_IDS=$(curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" \
            | jq -r --arg suffix "-pr${{ github.event.pull_request.number }}" \
              '.result[] | select(.queue_name | endswith($suffix)) | .queue_id')
          for QUEUE_ID in $QUEUE_IDS; do
            curl -sS -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues/$QUEUE_ID" \
              || true
          done

      - name: Update preview comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SHA_SHORT=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          APEX="pr${PR_NUMBER}"
          DASH_URL="https://dash.cloudflare.com/?to=/:account/workers/services/view/${PREVIEW_NAME}/production"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          UPDATED=$(date -u +"%b %-d, %Y, %-I:%M %p")

          BODY=$(printf '%s\n\n%s\n%s\n%s' \
            "The latest preview deployment for ${SHA_SHORT}" \
            "| Name | Status | Preview | Updated (UTC) |" \
            "| :--- | :----- | :------ | :------------ |" \
            "| [${APEX}](${DASH_URL}) | [![Shut Down](https://vercel.com/static/status/canceled.svg) Shut Down](${RUN_URL}) | [${APEX}.curl.md](https://${APEX}.curl.md) | ${UPDATED} |")

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.body | contains("preview deployment")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -X PATCH -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -X POST -f body="$BODY"
          fi
