name: Preview Sweep

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  WRANGLER_SEND_METRICS: false

jobs:
  sweep:
    name: Cleanup Orphaned Previews
    runs-on: ubuntu-latest
    outputs:
      cleaned_prs: ${{ steps.cleanup.outputs.cleaned_prs }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Cleanup orphaned previews
        id: cleanup
        run: |
          # List all workers via Cloudflare API and filter for preview pattern
          WORKERS=$(curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            | jq -r '.result[].id // empty' | grep '^curl-pr[0-9]*$' || true)

          if [ -z "$WORKERS" ]; then
            echo "No preview workers found"
            echo "cleaned_prs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found preview workers:"
          echo "$WORKERS"
          echo ""

          CLEANED_PRS="[]"
          for worker in $WORKERS; do
            PR_NUM=$(echo "$worker" | sed 's/curl-pr//')
            PR_INFO=$(gh pr view "$PR_NUM" --json state,headRefOid 2>/dev/null || echo '{}')
            STATE=$(echo "$PR_INFO" | jq -r '.state // "UNKNOWN"')

            if [ "$STATE" = "OPEN" ]; then
              echo "Skipping $worker (PR #$PR_NUM is open)"
              continue
            fi

            echo "Cleaning up $worker (PR #$PR_NUM state: $STATE)"

            echo "  Deleting worker..."
            pnpm exec wrangler delete "$worker" --force || echo "  Failed to delete worker"

            echo "  Deleting D1 database..."
            pnpm exec wrangler d1 delete "curl-db-pr$PR_NUM" --skip-confirmation || echo "  Failed to delete D1"

            echo "  Deleting KV namespace..."
            KV_ID=$(pnpm exec wrangler kv namespace list | jq -r --arg name "curl-kv-pr$PR_NUM" '.[] | select(.title == $name) | .id')
            if [ -n "$KV_ID" ]; then
              pnpm exec wrangler kv namespace delete --namespace-id "$KV_ID" -y || echo "  Failed to delete KV"
            fi

            echo "  Deleting Queue..."
            pnpm exec wrangler queues delete "curl-tokens-pr$PR_NUM" --force || echo "  Failed to delete Queue"

            # Collect cleaned PR info as JSON
            SHA=$(echo "$PR_INFO" | jq -r '.headRefOid // ""')
            CLEANED_PRS=$(echo "$CLEANED_PRS" | jq -c --arg pr "$PR_NUM" --arg sha "$SHA" \
              '. + [{"pr": $pr, "sha": $sha}]')

            echo "  Done"
            echo ""
          done

          echo "cleaned_prs=$CLEANED_PRS" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-comments:
    name: Update PR Comment
    needs: sweep
    if: needs.sweep.outputs.cleaned_prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.sweep.outputs.cleaned_prs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Update preview comment
        uses: ./.github/actions/preview-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ matrix.pr.pr }}
          sha: ${{ matrix.pr.sha }}
          status: shut-down
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
