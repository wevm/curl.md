name: Preview Deploy

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      sha:
        required: true
        type: string

concurrency:
  group: preview-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_NAME: curl-pr${{ inputs.pr_number }}
  PREVIEW_HYPERDRIVE_NAME: curl-hd-pr${{ inputs.pr_number }}
  PREVIEW_BRANCH_NAME: pr-${{ inputs.pr_number }}
  PREVIEW_KV_NAME: curl-kv-pr${{ inputs.pr_number }}
  WRANGLER_SEND_METRICS: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Comment building status
        run: |
          SHA_SHORT=$(echo "${{ inputs.sha }}" | cut -c1-7)
          APEX="pr${{ inputs.pr_number }}"
          DASH_URL="https://dash.cloudflare.com/?to=/:account/workers/services/view/${PREVIEW_NAME}/production"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          UPDATED=$(date -u +"%b %-d, %Y, %-I:%M %p")

          BODY=$(printf '%s\n\n%s\n%s\n%s' \
            "The latest preview deployment for ${SHA_SHORT}" \
            "| Name | Status | Preview | Updated (UTC) |" \
            "| :--- | :----- | :------ | :------------ |" \
            "| [${APEX}](${DASH_URL}) | [![Building](https://vercel.com/static/status/building.svg) Building](${RUN_URL}) | — | ${UPDATED} |")

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ inputs.pr_number }}/comments" --paginate --jq '.[] | select(.body | contains("preview deployment")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -X PATCH -f body="${BODY}"
          else
            gh api "repos/${{ github.repository }}/issues/${{ inputs.pr_number }}/comments" -X POST -f body="${BODY}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup pscale
        uses: planetscale/setup-pscale-action@d0c2789e7018488bae9d469592876b3428fa03f6 # v1

      - name: Setup PlanetScale branch
        id: ps
        run: |
          set +e
          pscale branch show "$PLANETSCALE_DB" "$PREVIEW_BRANCH_NAME" --org "$PLANETSCALE_ORG" > /dev/null 2>&1
          exit_code=$?
          set -e

          if [ $exit_code -ne 0 ]; then
            echo "Branch does not exist. Creating."
            pscale branch create "$PLANETSCALE_DB" "$PREVIEW_BRANCH_NAME" --from main --wait --org "$PLANETSCALE_ORG"
          else
            echo "Branch exists. Skipping creation."
          fi

          CREDS=$(pscale role create "$PLANETSCALE_DB" "$PREVIEW_BRANCH_NAME" "preview-$(date +%s)" -f json --inherited-roles postgres --org "$PLANETSCALE_ORG")
          HOST=$(echo "$CREDS" | jq -r '.access_host_url')
          USER=$(echo "$CREDS" | jq -r '.username')
          PASS=$(echo "$CREDS" | jq -r '.password')
          DB_URL="postgresql://${USER}:${PASS}@${HOST}/postgres?sslmode=require"
          echo "::add-mask::$DB_URL"
          echo "db_url=$DB_URL" >> "$GITHUB_OUTPUT"
        env:
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_ORG: ${{ secrets.PLANETSCALE_ORG }}
          PLANETSCALE_DB: ${{ secrets.PLANETSCALE_DB }}

      - name: Setup preview Hyperdrive
        id: hyperdrive
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          # Parse connection string components
          ORIGIN_USER=$(echo "$DB_URL" | sed -n 's|^postgresql://\([^:]*\):.*|\1|p')
          ORIGIN_PASS=$(echo "$DB_URL" | sed -n 's|^postgresql://[^:]*:\([^@]*\)@.*|\1|p')
          ORIGIN_HOST=$(echo "$DB_URL" | sed -n 's|^postgresql://[^@]*@\([^/]*\)/.*|\1|p')
          ORIGIN_DB=$(echo "$DB_URL" | sed -n 's|^postgresql://[^/]*/\([^?]*\).*|\1|p')

          # Check for existing Hyperdrive config
          OLD_ID=$(curl -sS -H "$AUTH" "$API" \
            | jq -r --arg name "$PREVIEW_HYPERDRIVE_NAME" '(.result // [])[] | select(.name == $name) | .id' 2>/dev/null || true)

          if [ -n "$OLD_ID" ]; then
            # Update existing config (avoids downtime from delete+create)
            echo "Updating existing Hyperdrive $OLD_ID"
            curl -sS -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
              "$API/$OLD_ID" \
              -d "{\"origin\":{\"scheme\":\"postgresql\",\"host\":\"$ORIGIN_HOST\",\"port\":5432,\"database\":\"$ORIGIN_DB\",\"user\":\"$ORIGIN_USER\",\"password\":\"$ORIGIN_PASS\"}}" > /dev/null
            HD_ID="$OLD_ID"
          else
            # Create new Hyperdrive config (retry up to 5 times for DNS propagation)
            for i in 1 2 3 4 5; do
              OUTPUT=$(pnpm exec wrangler hyperdrive create "$PREVIEW_HYPERDRIVE_NAME" \
                --connection-string="$DB_URL" 2>&1) && break
              echo "Attempt $i failed, retrying in 10s: $OUTPUT"
              sleep 10
            done
            HD_ID=$(echo "$OUTPUT" | grep -oE '[0-9a-f]{32}' | head -1)
            if [ -z "$HD_ID" ]; then
              echo "::error::Failed to create Hyperdrive config after 5 attempts: $OUTPUT"
              exit 1
            fi
          fi

          echo "Hyperdrive $HD_ID"
          echo "id=$HD_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_URL: ${{ steps.ps.outputs.db_url }}

      - name: Setup preview KV
        id: kv
        run: |
          KV_ID=$(pnpm exec wrangler kv namespace list | jq -r --arg name "$PREVIEW_KV_NAME" '.[] | select(.title == $name) | .id')
          if [ -z "$KV_ID" ]; then
            OUTPUT=$(pnpm exec wrangler kv namespace create "$PREVIEW_KV_NAME" 2>&1)
            KV_ID=$(echo "$OUTPUT" | grep -o '"id": "[^"]*"' | head -1 | cut -d'"' -f4)
          fi
          echo "id=$KV_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Setup Stripe webhook endpoint
        id: stripe
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          APEX="pr${{ inputs.pr_number }}"

          # Delete existing webhook endpoints for this preview
          EXISTING=$(curl -sS https://api.stripe.com/v1/webhook_endpoints?limit=100 \
            -u "$STRIPE_SECRET_KEY:" \
            | jq -r --arg apex "$APEX" '.data[] | select(.metadata.preview == $apex) | .id')
          for id in $EXISTING; do
            curl -sS -X DELETE "https://api.stripe.com/v1/webhook_endpoints/$id" \
              -u "$STRIPE_SECRET_KEY:" > /dev/null
          done

          RESPONSE=$(curl -sS https://api.stripe.com/v1/webhook_endpoints \
            -u "$STRIPE_SECRET_KEY:" \
            -d "url=https://${APEX}.curl.md/api/stripe/webhook" \
            -d "enabled_events[]=payment_intent.succeeded" \
            -d "enabled_events[]=charge.dispute.created" \
            -d "enabled_events[]=refund.created" \
            -d "metadata[preview]=${APEX}")
          ENDPOINT_ID=$(echo "$RESPONSE" | jq -r '.id')
          WEBHOOK_SECRET=$(echo "$RESPONSE" | jq -r '.secret')
          echo "::add-mask::$WEBHOOK_SECRET"
          echo "id=$ENDPOINT_ID" >> "$GITHUB_OUTPUT"
          echo "secret=$WEBHOOK_SECRET" >> "$GITHUB_OUTPUT"

      - name: Setup preview wrangler.jsonc
        run: |
          sed -i.bak \
            -e "s|__PREVIEW_NAME__|$PREVIEW_NAME|g" \
            -e "s|__PREVIEW_APEX__|pr${{ inputs.pr_number }}|g" \
            -e "s|__PREVIEW_HYPERDRIVE_ID__|${{ steps.hyperdrive.outputs.id }}|g" \
            -e "s|__PREVIEW_KV_ID__|${{ steps.kv.outputs.id }}|g" \
            wrangler.jsonc

      - name: Setup preview queues
        run: |
          QUEUES=$(node -e '
            const text = require("fs").readFileSync("wrangler.jsonc", "utf8")
              .replace(/(?<=^[^"]*(?:"[^"]*"[^"]*)*)\/\/.*$/gm, "")
              .replace(/,(\s*[\]}])/g, "$1");
            const queues = JSON.parse(text).env.preview.queues;
            const names = new Set([...queues.producers.map(p => p.queue), ...queues.consumers.map(c => c.queue)]);
            for (const name of names) console.log(name);
          ')
          for queue in $QUEUES; do
            pnpm exec wrangler queues create "$queue" 2>/dev/null || true
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run migrations on preview database
        run: pnpm db:migrate latest
        env:
          DB_URL: ${{ steps.ps.outputs.db_url }}

      - name: Generate types
        run: |
          pnpm gen:types
          pnpm db:codegen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB_URL: ${{ steps.ps.outputs.db_url }}

      - name: Build
        run: pnpm build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ENV: preview
          DB_URL: ${{ secrets.DB_URL }}
          GIT_SHA: ${{ inputs.sha }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env preview
          environment: preview
          wranglerVersion: ''
          vars: |
            STRIPE_PUBLISHABLE_KEY
          secrets: |
            COOKIE_SECRET
            GH_CLIENT_ID
            GH_CLIENT_SECRET
            SENTRY_DSN
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            TOKEN_ENCRYPTION_KEY
        env:
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ steps.stripe.outputs.secret }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}

      - name: Comment deploy status
        if: always()
        run: |
          SHA_SHORT=$(echo "${{ inputs.sha }}" | cut -c1-7)
          APEX="pr${{ inputs.pr_number }}"
          DASH_URL="https://dash.cloudflare.com/?to=/:account/workers/services/view/${PREVIEW_NAME}/production"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          UPDATED=$(date -u +"%b %-d, %Y, %-I:%M %p")

          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            STATUS="[![Ready](https://vercel.com/static/status/ready.svg) Ready](${RUN_URL})"
            PREVIEW="[${APEX}.curl.md](https://${APEX}.curl.md)"
          else
            STATUS="[![Error](https://vercel.com/static/status/error.svg) Error](${RUN_URL})"
            PREVIEW="[${APEX}.curl.md](https://${APEX}.curl.md)"
          fi

          PSCALE_URL="https://app.planetscale.com/${{ secrets.PLANETSCALE_ORG }}/${{ secrets.PLANETSCALE_DB }}/branches/${PREVIEW_BRANCH_NAME}"
          STRIPE_URL="https://dashboard.stripe.com/webhooks/${{ steps.stripe.outputs.id }}"

          BODY=$(cat <<EOF
          The latest preview deployment for ${SHA_SHORT}

          | Name | Status | Preview | Updated (UTC) |
          | :--- | :----- | :------ | :------------ |
          | [${APEX}](${DASH_URL}) | ${STATUS} | ${PREVIEW} | ${UPDATED} |

          <details><summary>Services</summary>

          <ul>
          <li><a href="${DASH_URL}">Cloudflare</a></li>
          <li><a href="${PSCALE_URL}">PlanetScale</a></li>
          <li><a href="${STRIPE_URL}">Stripe</a></li>
          </ul>

          </details>
          EOF
          )

          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ inputs.pr_number }}/comments" --paginate --jq '.[] | select(.body | contains("preview deployment")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -X PATCH -f body="${BODY}"
          else
            gh api "repos/${{ github.repository }}/issues/${{ inputs.pr_number }}/comments" -X POST -f body="${BODY}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
