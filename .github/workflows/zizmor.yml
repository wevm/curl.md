name: zizmor

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: wevm/actions/vendor/zizmorcore/zizmor-action/v0.5.4@8963daf30237417f873c8e2f17e3bf9415e3a7b9
