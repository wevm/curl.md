name: Check

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
          --health-timeout 5s
        ports: ['5432:5432']
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-pnpm

      - name: Audit dependencies
        run: pnpm audit

      - name: Lint
        run: pnpm check

      - name: Run migrations
        run: pnpm db:migrate latest

      - name: Write .env
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          {
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "DB_URL=$DB_URL"
            echo "GH_CLIENT_ID=dummy"
            echo "COOKIE_SECRET=dummy"
            echo "GH_CLIENT_SECRET=dummy"
            echo "SENTRY_DSN=https://fake@o0.ingest.sentry.io/0"
            echo "STRIPE_PUBLISHABLE_KEY=pk_test_fake"
            echo "STRIPE_SECRET_KEY=sk_test_fake"
            echo "STRIPE_WEBHOOK_SECRET=whsec_test_fake"
            echo "TOKEN_ENCRYPTION_KEY=dGVzdC1lbmNyeXB0aW9uLWtleXRlc3QtZW5jcnlwdGk="
            echo "WRANGLER_SEND_METRICS=false"
          } > .env

      - name: Generate code
        run: |
          pnpm gen:types
          pnpm db:codegen

      - name: Check types
        run: pnpm check:types

      - name: Test
        run: pnpm test --project app --project md --project workers

      - name: Build
        run: pnpm build

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-pnpm

      - name: Shellcheck
        run: shellcheck public/install.sh

      - name: Test
        run: pnpm test --project cli

      - name: Build
        run: pnpm build:cli

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-pnpm

      - name: Cache Playwright
        id: playwright-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: test/test-results/
          retention-days: 30
