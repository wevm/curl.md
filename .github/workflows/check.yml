name: Check

on:
  workflow_call:
    inputs:
      dispatch_pro_sha:
        description: If set, dispatches pro tests for this commit SHA
        type: string
      dispatch_preview_pr:
        description: If set, dispatches preview deploy for this PR number
        type: string
      submodules:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
          --health-timeout 5s
        ports: ['5432:5432']
    steps:
      - name: Generate token
        if: inputs.submodules
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.PRO_APP_ID }}
          private-key: ${{ secrets.PRO_APP_PRIVATE_KEY }}
          repositories: curl.md.pro

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Checkout submodules
        if: inputs.submodules
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/wevm/curl.md.pro".insteadOf "https://github.com/wevm/curl.md.pro"
          git submodule update --init
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Setup
        uses: ./.github/actions/setup-pnpm

      - name: Shellcheck
        run: shellcheck public/install.sh

      - name: Lint
        run: pnpm check

      - name: Run migrations
        run: pnpm db:migrate latest

      - name: Write .env
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          {
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "DB_URL=$DB_URL"
            echo "GH_CLIENT_ID=dummy"
            echo "COOKIE_SECRET=dummy"
            echo "GH_CLIENT_SECRET=dummy"
            echo "TOKEN_ENCRYPTION_KEY=dGVzdC1lbmNyeXB0aW9uLWtleXRlc3QtZW5jcnlwdGk="
            echo "WRANGLER_SEND_METRICS=false"
          } > .env

      - name: Generate code
        run: |
          pnpm gen:types
          pnpm db:codegen

      - name: Check types
        run: pnpm check:types

      - name: Test
        run: pnpm test --exclude 'pro/**'

      - name: Build
        run: pnpm build

      - name: Build CLI
        run: pnpm build:cli

  dispatch:
    name: Dispatch
    needs: verify
    if: inputs.dispatch_pro_sha || inputs.dispatch_preview_pr
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.PRO_APP_ID }}
          private-key: ${{ secrets.PRO_APP_PRIVATE_KEY }}
          repositories: curl.md.pro

      - name: Dispatch test
        if: inputs.dispatch_pro_sha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          printf '{"event_type":"parent-check","client_payload":{"sha":"%s"}}' "${{ inputs.dispatch_pro_sha }}" \
            | gh api repos/wevm/curl.md.pro/dispatches --method POST --input -

      - name: Dispatch preview
        if: inputs.dispatch_preview_pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          printf '{"event_type":"preview-deploy","client_payload":{"sha":"%s","pr_number":"%s"}}' \
            "${{ inputs.dispatch_pro_sha }}" "${{ inputs.dispatch_preview_pr }}" \
            | gh api repos/wevm/curl.md.pro/dispatches --method POST --input -
