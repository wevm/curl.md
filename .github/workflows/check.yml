name: Check

on:
  workflow_call:
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 5
          --health-timeout 2s
        ports: ['5432:5432']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Audit dependencies
        run: pnpm audit

      - name: Lint
        run: pnpm check

      - name: Run migrations
        run: pnpm db:migrate latest

      - name: Write .env
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          {
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "CLOUDFLARE_BROWSER_API_TOKEN=dummy"
            echo "DB_URL=$DB_URL"
            echo "GH_CLIENT_ID=dummy"
            echo "COOKIE_SECRET=dummy"
            echo "GH_CLIENT_SECRET=dummy"
            echo "SENTRY_DSN=https://fake@o0.ingest.sentry.io/0"
            echo "STRIPE_PUBLISHABLE_KEY=pk_test_fake"
            echo "STRIPE_SECRET_KEY=sk_test_fake"
            echo "STRIPE_WEBHOOK_SECRET=whsec_test_fake"
            echo "TOKEN_ENCRYPTION_KEY=dummy"
            echo "WRANGLER_SEND_METRICS=false"
          } > .env

      - name: Generate code
        run: |
          pnpm gen:claude
          pnpm preconstruct
          pnpm gen:types
          pnpm db:codegen

      - name: Check generated code
        run: |
          git diff --exit-code -- \
            .claude-plugin/marketplace.json \
            cli/src/cf-env.d.ts \
            db/schemas.gen.ts \
            db/types.gen.ts \
            plugins/claude/.claude-plugin/plugin.json \
            src/worker-configuration.d.ts

      - name: Check types
        run: pnpm check:types

      - name: Build
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Test
        run: pnpm test --project app --project browser --project md --project workers --run

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Check dependencies
        run: pnpm check:deps

      - name: Shellcheck
        run: shellcheck public/install.sh

      - name: Test
        run: pnpm test --project cli

      - name: Build
        run: pnpm --filter curl.md build

  plugins:
    name: Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Preconstruct
        run: |
          pnpm preconstruct
          pnpm --dir plugins/claude rebuild @anthropic-ai/claude-code --pending

      - name: Test
        run: pnpm test --project plugins:amp --project plugins:claude --project plugins:opencode --project plugins:pi

      - name: Build
        run: |
          pnpm --filter @curl.md/amp build
