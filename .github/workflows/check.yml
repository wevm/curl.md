name: Check

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
          --health-timeout 5s
        ports: ['5432:5432']
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-pnpm

      - name: Audit dependencies
        run: pnpm audit

      - name: Shellcheck
        run: shellcheck public/install.sh

      - name: Lint
        run: pnpm check

      - name: Run migrations
        run: pnpm db:migrate latest

      - name: Write .env
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          {
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "DB_URL=$DB_URL"
            echo "GH_CLIENT_ID=dummy"
            echo "COOKIE_SECRET=dummy"
            echo "GH_CLIENT_SECRET=dummy"
            echo "SENTRY_DSN=https://fake@o0.ingest.sentry.io/0"
            echo "STRIPE_PUBLISHABLE_KEY=pk_test_fake"
            echo "STRIPE_SECRET_KEY=sk_test_fake"
            echo "STRIPE_WEBHOOK_SECRET=whsec_test_fake"
            echo "TOKEN_ENCRYPTION_KEY=dGVzdC1lbmNyeXB0aW9uLWtleXRlc3QtZW5jcnlwdGk="
            echo "WRANGLER_SEND_METRICS=false"
          } > .env

      - name: Generate code
        run: |
          pnpm gen:types
          pnpm db:codegen

      - name: Check types
        run: pnpm check:types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build CLI
        run: pnpm build:cli
