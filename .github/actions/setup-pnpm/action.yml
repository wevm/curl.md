name: Setup pnpm
description: Setup pnpm and Node.js

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: wevm/actions/vendor/pnpm/action-setup/v6@8963daf30237417f873c8e2f17e3bf9415e3a7b9

    - name: Setup node
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm --dir cli rebuild bun --pending
